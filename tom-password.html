<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock Deal Desk Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f7f6f3; --panel:#fff; --fg:#1d1c1a; --muted:#6b6862; --line:#e4e1db; --accent:#2f6fdb; --ok:#2e7d4f; --bad:#c0392b;
    --sans:'Inter',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#161614; --panel:#1f1e1c; --fg:#ecebe8; --muted:#a29e96; --line:#33312d; --accent:#7aa6f5; --ok:#6cc592; --bad:#ef6b5b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
  .wrap{max-width:560px;margin:8vh auto;padding:0 18px}
  h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
  .row{margin-bottom:14px}
  input{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
  input:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  button{font:inherit;font-weight:500;padding:11px 20px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:400}
  button:disabled{opacity:.5;cursor:default}
  .msg{min-height:1.2em;font-size:13px;margin-top:14px;color:var(--muted)}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .meter{height:6px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s,background .2s}
  code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lock Deal Desk Daily</h1>
  <p class="sub">Set a password and download the encrypted dashboard. The password never leaves this page &mdash; it is not sent anywhere.</p>
  <div class="card">
    <div class="row">
      <label for="pw">Password</label>
      <input id="pw" type="text" autocomplete="off" spellcheck="false" placeholder="Choose a strong password or passphrase">
      <div class="meter"><i id="bar"></i></div>
      <div class="hint" id="hint">The whole dashboard is encrypted with this. Anyone with the file can try to guess it offline, so make it long.</div>
    </div>
    <div class="row">
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="text" autocomplete="off" spellcheck="false" placeholder="Type it again">
    </div>
    <div class="btns">
      <button id="go" disabled>Lock &amp; download</button>
      <button id="gen" class="ghost" type="button">Suggest a strong one</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
</div>
