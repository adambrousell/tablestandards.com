<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>River Pointe Inn — Category Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f5f0; --surface: #fff; --border: rgba(0,0,0,0.09); --border-strong: rgba(0,0,0,0.16);
  --text: #1a1a18; --text-2: #6b6b67; --text-3: #9f9f9b;
  --accent: #2a5f3c; --up: #1a7a3a; --up-bg: #e8f5ed; --down: #b83030; --down-bg: #faeaea;
  --neutral: #888780; --r: 6px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { font-family: 'DM Serif Display', serif; font-size: 20px; }
.logo span { font-style: italic; color: var(--text-2); font-size: 17px; }

.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 40px; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.login-card h1 { font-family: 'DM Serif Display', serif; font-size: 24px; margin-bottom: 8px; }
.login-card p { font-size: 13px; color: var(--text-3); margin-bottom: 24px; }
.login-card input { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--r); padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; margin-bottom: 16px; outline: none; }
.login-card input:focus { border-color: var(--accent); }
.login-card button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--r); padding: 10px; font-size: 14px; font-weight: 500; cursor: pointer; }
.login-card button:hover { opacity: 0.88; }
.login-error { color: var(--down); font-size: 12px; margin-bottom: 12px; }

.main-content { display: none; }
.main-content.authed { display: block; }

#data-input-section { margin: 20px 32px; }
.paste-card { background: var(--surface); border: 1.5px dashed var(--border-strong); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.paste-label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.paste-card textarea { width: 100%; height: 100px; border: 1px solid var(--border); border-radius: var(--r); padding: 8px 10px; font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--text); background: var(--bg); resize: vertical; outline: none; }
.paste-card textarea:focus { border-color: var(--accent); }

.action-row { margin: 0 32px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.parse-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--r); padding: 9px 22px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.parse-btn:hover { opacity: 0.88; }
.parse-btn:disabled { opacity: 0.5; cursor: default; }
.clear-btn { background: transparent; color: var(--text-2); border: 1px solid var(--border-strong); border-radius: var(--r); padding: 9px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
#parse-status { font-size: 12px; color: var(--text-3); }

#dashboard { display: none; margin: 0 32px 40px; }
#dashboard.active { display: block; }

.toggle-section { margin: 0 32px 20px; display: flex; gap: 10px; }
.toggle-btn { background: var(--surface); color: var(--text-2); border: 1px solid var(--border-strong); border-radius: var(--r); padding: 8px 18px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; font-weight: 500; }
.toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.kpi-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.kpi-val { font-family: 'DM Serif Display', serif; font-size: 26px; line-height: 1; color: var(--text); }
.kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 14px; }
.card-title span { font-family: 'DM Serif Display', serif; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--text); margin-right: 8px; }

.cat-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.cat-row:last-child { border-bottom: none; }
.cat-name { width: 180px; color: var(--text); font-weight: 500; }
.cat-bar { flex: 1; height: 20px; background: var(--border); border-radius: 3px; position: relative; overflow: hidden; }
.cat-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
.cat-val { width: 80px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }

.hm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 14px; }
.hm-cell { border-radius: 4px; padding: 10px; cursor: default; }
.hm-name { font-size: 11px; font-weight: 500; color: #fff; line-height: 1.3; }
.hm-meta { font-size: 10px; color: rgba(255,255,255,0.8); margin-top: 3px; }

.header-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.logout-btn { font-size: 12px; color: var(--text-3); background: transparent; border: 1px solid var(--border-strong); padding: 6px 12px; border-radius: var(--r); cursor: pointer; }
.logout-btn:hover { color: var(--text-2); border-color: var(--text-2); }

.week-label { font-size: 12px; color: var(--text-3); }

@media (max-width: 700px) {
  .action-row, #data-input-section { margin-left: 16px; margin-right: 16px; }
  .cat-name { width: 120px; }
  .hm-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h1>Product Mix</h1>
    <p>River Pointe Inn</p>
    <div id="login-error" class="login-error"></div>
    <input type="password" id="password-input" placeholder="Enter password" onkeypress="if(event.key==='Enter') authenticate()">
    <button onclick="authenticate()">Access</button>
  </div>
</div>

<!-- Main Content -->
<div class="main-content" id="main-content">
  <header>
    <div class="logo">River Pointe Inn <span>— category ranking</span></div>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </header>

  <div id="data-input-section" style="display:none;">
    <div class="paste-card">
      <div class="paste-label">Paste Toast product mix export</div>
      <textarea id="raw-data" placeholder="Paste this week's Toast product mix export..."></textarea>
    </div>
    <div class="action-row">
      <button class="parse-btn" onclick="parseAndRender()">Parse & render</button>
      <button class="clear-btn" onclick="clearAll()">Clear</button>
      <span id="parse-status"></span>
    </div>
  </div>

  <div id="dashboard">
    <div class="header-bar">
      <div>
        <div class="logo" style="font-size:16px;margin-bottom:4px;">Week of <span class="week-label" id="week-label"></span></div>
      </div>
      <div class="toggle-section">
        <button class="toggle-btn active" onclick="setView('revenue')">Revenue</button>
        <button class="toggle-btn" onclick="setView('quantity')">Quantity</button>
      </div>
    </div>

    <div id="kpi-grid" class="kpi-grid"></div>

    <div class="card">
      <div class="card-title"><span id="ranking-title">Categories by revenue</span></div>
      <div id="ranking-list"></div>
    </div>

    <div class="card">
      <div class="card-title"><span>Category heatmap</span></div>
      <div id="heatmap"></div>
    </div>

    <div id="debug-section" style="margin:20px 0;padding:0 18px;display:none;">
      <button class="clear-btn" onclick="toggleDataInput()">Re-enter data</button>
    </div>
  </div>
</div>

<script>
const CAT_COLORS = {
  cocktail:'#2150a0', wine:'#5c2d6e', food:'#c0452a',
  starter:'#2a5f3c', dessert:'#b8942a', spirit:'#4a7a8a',
  beer:'#7a5c2a', coffee:'#6b4e3d', na:'#888780',
  events:'#7a3060', pdj:'#0f766e',
};

const CAT_LABELS = {
  cocktail:'Cocktails & martinis', wine:'Wine (glass & bottle)', food:'Entrees & sides',
  starter:'Starters & raw bar', dessert:'Desserts', spirit:'Spirits',
  beer:'Beer', coffee:'Coffee & tea', na:'NA beverages',
  events:'Private Events & Wine Dinner', pdj:'Plat du Jour specials',
};

// ── Password Authentication ──────────────────────────────────────────────
// Simple SHA-256 hash for password. Change PASSWORD_HASH to your desired password hash.
// To generate: open browser console and run: await crypto.subtle.digest('SHA-256', new TextEncoder().encode('your-password')).then(h=>Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''))
const PASSWORD_HASH = '5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5'; // hash of '12345' — CHANGE THIS

async function hashPassword(pwd) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pwd);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function authenticate() {
  const pwd = document.getElementById('password-input').value.trim();
  if (!pwd) { showLoginError('Enter password'); return; }
  const hash = await hashPassword(pwd);
  if (hash === PASSWORD_HASH) {
    sessionStorage.setItem('rpi_authed', 'true');
    showMainContent();
  } else {
    showLoginError('Incorrect password');
  }
}

function showLoginError(msg) {
  const err = document.getElementById('login-error');
  err.textContent = msg;
  setTimeout(() => { err.textContent = ''; }, 3000);
}

function logout() {
  sessionStorage.removeItem('rpi_authed');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-content').classList.remove('authed');
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('data-input-section').style.display = 'none';
  document.getElementById('password-input').value = '';
  document.getElementById('raw-data').value = '';
}

function showMainContent() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-content').classList.add('authed');
  document.getElementById('data-input-section').style.display = 'block';
}

// Check auth on load
window.addEventListener('load', () => {
  if (sessionStorage.getItem('rpi_authed') === 'true') {
    showMainContent();
  }
});

// ── Data Parsing ──────────────────────────────────────────────────────────

const SKIP_NAMES = new Set([
  'drinks','dinner','lunch','na beverage','wine by the glass','wine by the bottle',
  'house cocktails & martinis','cocktails','martini happy hour','vodka & gin',
  'tequila & mezcal','whiskey','aperitifs, cognac, brandy, cordials',
  'dessert wines & fortified wine','beer','coffee & tea','raw bar & starters',
  'entrees & sides','dessert','add on\'s','private events','hors d\'oeuvres',
  'open items','gift card','total','location(s)','product mix','retail',
  'takeout','take out','take-out','to go','togo','online ordering','brunch',
  'delivery','catering','entrees','entrées','sides','sandwiches','specials',
]);

const GIFT_CARD_RE = /^gift\s*card|^add value\s*\(\$\)|^gift\s*card\s*\d/i;

function isSkipRow(name, price) {
  const n = name.toLowerCase().trim();
  if (n === 'lunch' && typeof price === 'number' && price > 0 && price <= 15) return false;
  if (SKIP_NAMES.has(n)) return true;
  if (GIFT_CARD_RE.test(n)) return true;
  if (/^\d[\d\-'s]*\s*(-\s*.+)?$/.test(n)) return true;
  if (/^location/i.test(n)) return true;
  if (/^total\b/i.test(n)) return true;
  if (/^menu\b|^menus?\s+item|^qty sold|^avg price|^item cogs/i.test(n)) return true;
  if (/questions or feedback|data delay|near real-time/i.test(n)) return true;
  if (/^case\s+|^6\s*pack\s+/i.test(n)) return true;
  return false;
}

function aggregateItems(items) {
  const map = new Map();
  const out = [];
  items.forEach(i => {
    const key = i.name.toLowerCase().replace(/^hh:\s*/, '').replace(/\s+/g, ' ').trim();
    if (map.has(key)) {
      const ex = map.get(key);
      const rev = ex.qty * ex.price + i.qty * i.price;
      ex.qty += i.qty;
      ex.price = ex.qty > 0 ? rev / ex.qty : 0;
      if (/^hh:/i.test(ex.name) && !/^hh:/i.test(i.name)) ex.name = i.name;
    } else {
      const copy = { ...i };
      map.set(key, copy);
      out.push(copy);
    }
  });
  return out;
}

function parsePaste(raw) {
  const lines = raw.split('\n').map(l => l.replace(/[\u00A0\u2007\u202F]/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const items = [];
  let dateRange = '';
  const dateMatch = raw.match(/Date range\s+([\w\s,\-–\/]+?\d{4})/i);
  if (dateMatch) dateRange = dateMatch[1].trim();

  for (const line of lines) {
    const m = line.match(/^(.+?)\s+([\d,]+)\s+\$([\d,.]+)(?:\s+\$([\d,.]+))?\s*$/);
    if (!m) continue;
    const name = m[1].trim();
    const qty = parseInt(m[2].replace(/,/g, ''));
    let price = parseFloat(m[3].replace(/,/g, ''));
    const netSales = m[4] !== undefined ? parseFloat(m[4].replace(/,/g, '')) : null;
    if (netSales !== null && !isNaN(netSales) && qty > 0) price = netSales / qty;
    if (isNaN(qty) || qty <= 0 || isNaN(price) || price < 0 || name.length < 2) continue;
    if (isSkipRow(name, price)) continue;
    items.push({ name, qty, price });
  }
  return { items: aggregateItems(items), dateRange };
}

function categorize(name) {
  const n = name.toLowerCase();
  if (/plat[e]?\s*d[eu]\s*jour|\bd[eu]\s*jour\b|^pdj\b/.test(n)) return 'pdj';
  if (/espresso martini|salt air|filthy|metropolitan|jockey club|river pointe|grasshopper|in fashion|saint joe|lychee|can't elope|pep in your|bee sting|negroni|strawberry fields|colada|hh:|martini happy hour|ancho problem|rhubarb/.test(n)) return 'cocktail';
  if (/aperol spritz|hugo spritz|french 75|paper plane|mimosa|bloody mary|lemon drop|mojito|moscow mule/.test(n)) return 'cocktail';
  if (/na almost|na pear|na espresso/.test(n)) return 'cocktail';
  if (/^gl:|cremant|brut ros|moet|drappier|folle blanche|albarino|ladoucette|drouhin.*secondes|pouilly|peyrassol|moulin.*vent|cotes du rh|guyon 2022|routestock|chappellet mountain|haut l'artigue/.test(n)) return 'wine';
  if (/wine by the bottle|btg bottle|sancerre|meursault|chablis|puligny|cabernet sauv|pride mountain|ridge.*lytton|kistler|o'shaugh|aubert.*carneros|turley|ducru|chauvin 2019|smith haut lafitte|leon beyer|melville|chevillon|cathiard|camus-bruchon|agrapart|sulauze|domaine pierre martin|francois de la roche|lauverjat|manarine|lafarge|domaine guyon|drouhin.*cotes de beaune|joseph drouhin|o'shaughnessy|maître de chai|le petit ducru|le petite smith/.test(n)) return 'wine';
  if (/^\d{3,4}[:\s]|^b\d{2,4}\b|^2\d{3}[:\s]/.test(n)) return 'wine';
  if (/latour pauillac somm|baron patrick laducette|blasson d'issan|hundred acre|fortunate son|domaine de montille|jean et s.*bastien dauvissat|stéphane aviron|henri billiot|banyuls|d'oliveiras|taylor fladgate|chateau d'yquem|domaine dominique guyon|bourgogne|chinon|lestang|domaine de pallus|giacometti|patrimonio|brio by ch|rauzan|saint-joseph|brecheras|pallus|chantegrive|meyer-fonn|paul blanck|hermann j wiemer|domaine michel lafarge|petit chablis l\. michel|drouhin-vaudon|chablis.*dauvissat/.test(n)) return 'wine';
  if (/\b(vodka|belvedere|grey goose|ketel one|tito's|tito\b|hendrick|beefeater|bombay sapphire|botanist|fords gin|plymouth gin|tanqueray|absolut|monkey 47|asbury park gin|wodka)\b/.test(n)) return 'spirit';
  if (/\bcasamigos|don julio|fortaleza|lalo\b|pueblo viejo|casa dragones|del maguey|clase azul|g4 blanco|g4 reposado/.test(n)) return 'spirit';
  if (/\bangels envy|blanton|buffalo trace|bulleit|dewars|high west|jack daniel|jameson|johnnie walker|laguavulin|macallan|maker's mark|michter|oban 14|sazerac rye|whistlepig|widow jane|woodford reserve|basil hayden|four roses|penelope toasted\b/.test(n)) return 'spirit';
  if (/chartreuse|cognac park|lazzaroni amaretto|molinari sambuca|nonino amaro|averna amaro|limoncello|bailey's|campari|taylor fladgate|\bport\b|braulio|frangelico|rum|havana club|captain morgan/.test(n)) return 'spirit';
  if (/beer done|vliet|birdsmouth|kronenbourg|other half forever|athletic brewing/.test(n)) return 'beer';
  if (/^lunch\s*\d*\s*\$/.test(n) || n === 'lunch') return 'beer';
  if (/\bespresso\b|\bcappuccino\b|\bmacchiato\b|\bcoffee\b|peppermint tea|chamomile tea|earl gr[ae]y|green tea|black tea/.test(n)) return 'coffee';
  if (/btl.*still water|btl.*sparkling water|\bcoke\b|diet coke|sprite|ginger ale|club soda|ginger beer|shirley temple|lemonade|iced tea|apple juice|arnold palmer|pineapple juice|cranberry juice|fresh oj|milk/.test(n)) return 'na';
  if (/wagyu burger|ratatouille|paillard|moules frites|tuna prov|halibut|loup de mar|lasagna|au poivre|pork chop|steak frites|roast chicken for|ny strip|porterhouse|pommes frites|pommes duchess|haricot vert|peppers carmen|peas.*lard|poulet en croute|oysters rockefeller|french dip|southern fried quail|bouillabaise|short rib|lobster frites|crispy fish|salmon burger|pan bagnat|chicken salad sandwich|omelette|eggs benedict|hanger steak|kids tenders|kids cheeseburger|chicken fingers.*staff|wagyu burger.*staff|side donuts|salmon\b|branzino|red snapper|snapper|french onion lasagna|prime short rib|chicken au poivre|corn & lardons|corn.*lardons/.test(n)) return 'food';
  if (/bread service|little gem|garden salad|asparagus mimosa|escargots|^jambon|steak tartare|crepe aux|berries.*cream|caviar.*donut|crudo tasting|shrimp cocktail|tuna tartare|ceviche|dune fox|swan point|sugar shack|love.*dozen|barnegat|violet sky|salad de tomates|eggplant|peaches|^p\. /.test(n)) return 'starter';
  if (/carrot cake|meringue cake|chocolate cake|cheesecake|raspberry tart|creme brulee|banana split|brownie sundae|banana chip ice|brown butter ice|chocolate ice|strawberry ice|vanilla ice|mint ice|lemon sorbet|fromage/.test(n)) return 'dessert';
  if (/^wd\s|wine dinner|^wd bread|^wd crab|^wd gnudi|^wd monkfish|^wd new york|^wd mousse/.test(n)) return 'events';
  if (/^p\.|private event adult|private event child|event decor/.test(n)) return 'events';
  if (/^p\.(bread|jambon|berries|garden|hanger|duchess|haricot|au poivre|escargots|eggplant|little gem|chicken|branzino|potato|ny strip)|hanger add on|crudo\b|parfait|lunch oyster/.test(n)) return 'food';
  if (/open drink|open food|open item|case peyrassol|six pack guyon|custom cake/.test(n)) return 'food';
  return 'food';
}

const sumRev = arr => (arr||[]).reduce((s,i)=>s+i.qty*i.price, 0);
const sumQty = arr => (arr||[]).reduce((s,i)=>s+i.qty, 0);
const fmt = n => n.toLocaleString('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 });

let currentData = null;
let currentView = 'revenue';

function parseAndRender() {
  const raw = document.getElementById('raw-data').value.trim();
  if (!raw) {
    document.getElementById('parse-status').textContent = 'Paste data first.';
    return;
  }
  const parsed = parsePaste(raw);
  if (!parsed.items.length) {
    document.getElementById('parse-status').textContent = 'Could not parse items. Paste the full Toast product mix export.';
    return;
  }
  currentData = parsed;
  document.getElementById('parse-status').textContent = `✓ Parsed ${parsed.items.length} items.`;
  document.getElementById('data-input-section').style.display = 'none';
  document.getElementById('debug-section').style.display = 'block';
  renderDashboard();
}

function renderDashboard() {
  if (!currentData) return;
  const { items, dateRange } = currentData;
  document.getElementById('week-label').textContent = dateRange || 'Week loaded';

  const cats = {};
  items.forEach(i => {
    const c = categorize(i.name);
    if (!cats[c]) cats[c] = [];
    cats[c].push(i);
  });

  // Build ranking
  const ranking = Object.keys(cats).map(key => ({
    key,
    label: CAT_LABELS[key],
    color: CAT_COLORS[key],
    qty: sumQty(cats[key]),
    rev: sumRev(cats[key]),
  })).filter(r => r.qty > 0);

  const sorted = currentView === 'revenue'
    ? ranking.sort((a,b) => b.rev - a.rev)
    : ranking.sort((a,b) => b.qty - a.qty);

  const totalRev = ranking.reduce((s,r) => s + r.rev, 0);
  const totalQty = ranking.reduce((s,r) => s + r.qty, 0);

  // KPIs
  const kpis = [
    { label: 'Est. revenue', val: fmt(totalRev), sub: `${ranking.length} categories` },
    { label: 'Total qty sold', val: totalQty.toLocaleString(), sub: `${items.length} line items` },
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-val">${k.val}</div><div class="kpi-sub">${k.sub}</div></div>`
  ).join('');

  // Ranking list
  const maxVal = currentView === 'revenue' ? sorted[0].rev : sorted[0].qty;
  document.getElementById('ranking-title').textContent = currentView === 'revenue' ? 'Categories by revenue' : 'Categories by quantity';
  document.getElementById('ranking-list').innerHTML = sorted.map(r => {
    const val = currentView === 'revenue' ? r.rev : r.qty;
    const pct = Math.round(val / maxVal * 100);
    const displayVal = currentView === 'revenue' ? fmt(r.rev) : r.qty.toLocaleString();
    return `<div class="cat-row">
      <span class="cat-name">${r.label}</span>
      <span class="cat-bar"><span class="cat-bar-fill" style="width:${pct}%;background:${r.color};"><span style="font-size:10px;color:#fff;font-weight:500;padding-right:4px;">${pct}%</span></span></span>
      <span class="cat-val">${displayVal}</span>
    </div>`;
  }).join('');

  // Heatmap
  let hmHtml = '';
  sorted.forEach(cat => {
    const items_in_cat = [...cats[cat.key]].sort((a,b) => b.qty*b.price - a.qty*a.price).slice(0, 12);
    const maxRev = items_in_cat[0]?.qty * items_in_cat[0]?.price || 1;
    hmHtml += `<div style="margin-bottom:20px;">
      <div style="font-size:12px;margin-bottom:8px;color:${cat.color};font-weight:500;">▪ ${cat.label}</div>
      <div class="hm-grid">`;
    items_in_cat.forEach(item => {
      const itemRev = item.qty * item.price;
      const opacity = 0.3 + (itemRev / maxRev) * 0.7;
      const name = item.name.replace(/^(GL:|HH:)\s*/i,'');
      hmHtml += `<div class="hm-cell" style="background:${cat.color};opacity:${opacity.toFixed(2)};">
        <div class="hm-name">${name.substring(0,20)}${name.length>20?'…':''}</div>
        <div class="hm-meta">${item.qty} · ${fmt(itemRev)}</div>
      </div>`;
    });
    hmHtml += `</div></div>`;
  });
  document.getElementById('heatmap').innerHTML = hmHtml;

  document.getElementById('dashboard').classList.add('active');
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (currentData) renderDashboard();
}

function toggleDataInput() {
  if (document.getElementById('data-input-section').style.display === 'none') {
    document.getElementById('data-input-section').style.display = 'block';
    document.getElementById('dashboard').classList.remove('active');
  } else {
    document.getElementById('data-input-section').style.display = 'none';
  }
}

function clearAll() {
  document.getElementById('raw-data').value = '';
  document.getElementById('parse-status').textContent = '';
  document.getElementById('dashboard').classList.remove('active');
  currentData = null;
}
</script>
</body>
</html>
