<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>River Pointe Inn — Weekly Mix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f5f0; --surface: #fff; --border: rgba(0,0,0,0.09); --border-strong: rgba(0,0,0,0.16);
  --text: #1a1a18; --text-2: #6b6b67; --text-3: #9f9f9b;
  --accent: #2a5f3c; --up: #1a7a3a; --down: #b83030; --r: 6px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { font-family: 'DM Serif Display', serif; font-size: 20px; }
.logo span { font-style: italic; color: var(--text-2); font-size: 17px; }

.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin: 0 20px; }
.login-card h1 { font-family: 'DM Serif Display', serif; font-size: 24px; margin-bottom: 4px; }
.login-card p { font-size: 13px; color: var(--text-3); margin-bottom: 24px; }
.login-card input { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--r); padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; margin-bottom: 14px; outline: none; }
.login-card input:focus { border-color: var(--accent); }
.login-card button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--r); padding: 11px; font-size: 14px; font-weight: 500; cursor: pointer; }
.login-card button:hover { opacity: 0.88; }
.login-error { color: var(--down); font-size: 12px; margin-bottom: 12px; min-height: 16px; }

.main-content { display: none; }
.main-content.authed { display: block; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-3); }
.loading-spinner { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#dashboard { margin: 20px 32px 40px; display: none; }
#dashboard.active { display: block; }
@media (max-width: 700px) { #dashboard { margin: 16px 14px 40px; } }

.header-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.week-label { font-size: 13px; color: var(--text-2); }
.uploaded-label { font-size: 11px; color: var(--text-3); }
.logout-btn { font-size: 12px; color: var(--text-3); background: transparent; border: 1px solid var(--border-strong); padding: 6px 12px; border-radius: var(--r); cursor: pointer; }
.logout-btn:hover { color: var(--text-2); }

.toggle-section { display: flex; gap: 8px; }
.toggle-btn { background: var(--surface); color: var(--text-2); border: 1px solid var(--border-strong); border-radius: 20px; padding: 8px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; font-weight: 500; }
.toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.kpi-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.kpi-val { font-family: 'DM Serif Display', serif; font-size: 24px; line-height: 1.1; color: var(--text); }
.kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 14px; }
.card-title span { font-family: 'DM Serif Display', serif; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--text); margin-right: 8px; }

/* Category ranking rows */
.cat-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; border-radius: 4px; }
.cat-row:hover { background: #f1efe8; }
.cat-row:last-child { border-bottom: none; }
.hm-cat-section.flash { animation: hmflash 1.6s ease; }
@keyframes hmflash { 0% { background: #fdf6dd; } 100% { background: transparent; } }
.hm-cat-section { border-radius: 6px; scroll-margin-top: 70px; }
.cat-header-row { display: flex; align-items: center; gap: 10px; padding: 0 0 7px; border-bottom: 2px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: 500; }
.cat-share { width: 44px; text-align: right; color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.cat-rank { width: 22px; text-align: right; color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.cat-name { width: 190px; color: var(--text); font-weight: 500; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-bar { flex: 1; height: 18px; background: #efede6; border-radius: 3px; overflow: hidden; min-width: 40px; }
.cat-bar-fill { display: block; height: 100%; border-radius: 3px; transition: width 0.3s ease; min-width: 2px; }
.cat-val { width: 84px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 500; flex-shrink: 0; }
.cat-sub { width: 70px; text-align: right; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.cat-delta { width: 58px; text-align: right; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.cat-delta.up { color: var(--up); }
.cat-delta.down { color: var(--down); }
.cat-delta.flat { color: var(--text-3); }
@media (max-width: 700px) { .cat-name { width: 110px; } .cat-sub { display: none; } }

/* Item ranking inside each category (sorted high → low) */
.item-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
.item-name { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-qty { width: 44px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.item-rev { width: 70px; text-align: right; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }

/* Heatmap */
.hm-cat-section { margin-bottom: 18px; }
.hm-cat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; user-select: none; }
.hm-cat-label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.hm-cat-rev { font-size: 11px; color: var(--text-3); }
.hm-cat-toggle { font-size: 11px; color: var(--text-3); margin-left: auto; }
.leg-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.hm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 5px; }
.hm-grid.collapsed { display: none; }
.hm-cell { border-radius: 4px; padding: 9px 11px; border-left: 4px solid transparent; }
.hm-name { font-size: 11px; font-weight: 500; line-height: 1.3; }
.hm-meta { font-size: 10px; margin-top: 2px; }
.hm-delta { font-size: 10px; margin-top: 2px; font-weight: 600; }
.kpi-delta { display: inline-block; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 10px; margin-top: 5px; }
.kpi-delta.up { background: #e8f5ed; color: var(--up); }
.kpi-delta.down { background: #faeaea; color: var(--down); }
.kpi-delta.flat { background: #f1efe8; color: var(--text-3); }

.error-box { text-align: center; padding: 60px 20px; color: var(--down); }
.error-box p.small { font-size: 12px; color: var(--text-3); margin-top: 10px; }
.retry-btn { margin-top: 16px; background: var(--accent); color: #fff; border: none; border-radius: var(--r); padding: 9px 22px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h1>Weekly Product Mix</h1>
    <p>River Pointe Inn — kitchen view</p>
    <div id="login-error" class="login-error"></div>
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
    <button onclick="authenticate()">View this week</button>
  </div>
</div>

<!-- Main -->
<div class="main-content" id="main-content">
  <header>
    <div class="logo">River Pointe Inn <span>— weekly mix</span></div>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </header>

  <div id="loading" class="loading" style="display:none;">
    <div class="loading-spinner"></div>
    <p style="margin-top:12px;">Loading this week's mix...</p>
  </div>

  <div id="error-box" class="error-box" style="display:none;"></div>

  <div id="dashboard">
    <div class="header-bar">
      <div>
        <div class="week-label" id="week-label"></div>
        <div class="uploaded-label" id="uploaded-label"></div>
      </div>
      <div class="toggle-section">
        <button class="toggle-btn" id="tg-revenue" onclick="setView('revenue')">By revenue</button>
        <button class="toggle-btn active" id="tg-quantity" onclick="setView('quantity')">By quantity</button>
      </div>
    </div>

    <div id="kpi-grid" class="kpi-grid"></div>

    <div class="card">
      <div class="card-title"><span id="ranking-title">Categories ranked by quantity</span> highest → lowest · bar = share of week's total</div>
      <div id="ranking-list"></div>
    </div>

    <div class="card">
      <div class="card-title"><span>Items ranked within each category</span> highest → lowest · <span style="font-size:11px;color:var(--text-3);font-family:'DM Sans',sans-serif;">click a header to collapse</span></div>
      <div id="heatmap"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// CONFIG — no secrets in this file. The password is checked by the server,
// which returns a signed 12-hour session token. Nothing to steal here.
// ══════════════════════════════════════════════════════════════════════════
const WORKER_URL = 'https://rpi-pmix-backend.amusementstandards.workers.dev';

const CAT_COLORS = {
  cocktail:'#2150a0', wine:'#5c2d6e', food:'#c0452a',
  starter:'#2a5f3c', rawbar:'#155e75', dessert:'#b8942a', spirit:'#4a7a8a',
  beer:'#7a5c2a', coffee:'#6b4e3d', na:'#888780',
  events:'#7a3060', pdj:'#0f766e', lunch:'#556677', sides:'#9c6644',
};
const CAT_LABELS = {
  cocktail:'Cocktails & martinis', wine:'Wine (glass & bottle)', food:'Entrées',
  starter:'Starters', rawbar:'Raw bar (Les Fruits de Mer)', dessert:'Desserts', spirit:'Spirits',
  beer:'Beer', coffee:'Coffee & tea', na:'NA beverages',
  events:'Private Events & Wine Dinner', pdj:'Weekly specials (Plats du Jour)', lunch:'Lunch', sides:'Sides',
};

// ── Auth (server-side) ─────────────────────────────────────────────────────
function getToken() { return sessionStorage.getItem('rpi_chef_token') || ''; }

async function authenticate() {
  const pwd = document.getElementById('password-input').value;
  if (!pwd) { showLoginError('Enter password'); return; }
  const btn = document.querySelector('.login-card button');
  btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const resp = await fetch(`${WORKER_URL}/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    const data = await resp.json();
    if (!resp.ok) {
      showLoginError(data.error || 'Login failed');
      return;
    }
    sessionStorage.setItem('rpi_chef_token', data.token);
    document.getElementById('password-input').value = '';
    showMainContent();
  } catch (err) {
    showLoginError('Could not reach server — check your connection');
  } finally {
    btn.disabled = false; btn.textContent = 'View this week';
  }
}

function showLoginError(msg) {
  document.getElementById('login-error').textContent = msg;
  setTimeout(() => { document.getElementById('login-error').textContent = ''; }, 4000);
}

function logout() {
  sessionStorage.removeItem('rpi_chef_token');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-content').classList.remove('authed');
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('password-input').value = '';
}

function showMainContent() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-content').classList.add('authed');
  loadData();
}

document.getElementById('password-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') authenticate();
});
window.addEventListener('load', () => {
  if (getToken()) showMainContent();   // token validity is checked by the server on load
});

// ── Categorizer (matches riverpointeinn.com/menus structure) ───────────────
function categorize(name) {
  const n = name.toLowerCase();
  // Weekly specials (Plats du Jour) — Toast rings them by dish name
  if (/plat[e]?\s*d[eu]\s*jour|\bd[eu]\s*jour\b|^pdj\b/.test(n)) return 'pdj';
  if (/poulet en croute|poulet en cro|oysters? rockefeller|french dip|crispy fish\s*(&\s*)?frites|bouillabais|prime short rib|short rib bourg|lobster frites/.test(n)) return 'pdj';
  // Events & wine dinner — checked before food so "P. Hanger Steak" etc. never leak in
  if (/^wd\s|wine dinner/.test(n)) return 'events';
  if (/^p\s*\.|private event adult|private event child|event decor|grazing table|beer.*wine.*spritz|beverage package|\bpackage\b/.test(n)) return 'events';
  // Lunch-only items (Fri–Sun lunch menu)
  if (/omelette|eggs benedict|pan bagnat|chicken salad sandwich|salmon burger|crispy fish sandwich|^parfait$|lunch oyster/.test(n)) return 'lunch';
  // Sides — dinner Sides section plus add-on side items
  if (/pommes frites|pommes duchess|haricot vert|peppers carmen|corn & lardons|corn.*lardons|^side\s|side donuts/.test(n)) return 'sides';
  // Cocktails & martinis
  if (/espresso martini|salt air|filthy|metropolitan|jockey club|river pointe|the rpi|grasshopper|in fashion|saint joe|lychee|can't elope|pep in your|bee sting|negroni|strawberry fields|colada|hh:|martini happy hour|ancho problem|rhubarb|rhu-barbara/.test(n)) return 'cocktail';
  if (/aperol spritz|hugo spritz|french 75|paper plane|mimosa|bloody mary|lemon drop|mojito|moscow mule|vesper|garden state|cavaillon|berry spritz|cocogroni|sangria/.test(n)) return 'cocktail';
  if (/na almost|na pear|na espresso|na summer/.test(n)) return 'cocktail';
  // Wine — incl. somm selections & rare pours that ring as spirits-style lines
  if (/d[’']?yquem|latour pauillac|somm selection/.test(n)) return 'wine';
  if (/^gl:|^gl\s|cremant|brut ros|moet|drappier|folle blanche|albarino|ladoucette|drouhin.*secondes|pouilly|peyrassol|moulin.*vent|cotes du rh|guyon 2022|routestock|route stock|chappellet mountain|haut l'artigue|haut-l|pazo das bruxas|gros plant|jean aubron|saint-cyrgues|costières/.test(n)) return 'wine';
  if (/wine by the bottle|btg bottle|sancerre|meursault|chablis|puligny|cabernet sauv|pride mountain|ridge.*lytton|kistler|o'shaugh|aubert.*carneros|turley|ducru|chauvin 2019|smith haut lafitte|leon beyer|melville|chevillon|cathiard|camus-bruchon|agrapart|sulauze|domaine pierre martin|francois de la roche|lauverjat|manarine|lafarge|domaine guyon|drouhin.*cotes de beaune|joseph drouhin|o'shaughnessy|maître de chai|le petit ducru|le petite smith|pessac|picpoul|lieu dit|fess parker|daniel rion|petitot|hautes co|philéandre|lynch bages|cantenac|sociando|solitude|la rame|saint cyr|morgon|giacometti|patrimonio|arnot-roberts|fullerton|jk carriere|hundred acre|screaming eagle|lavieille|isabelle garrault|julie et patrick/.test(n)) return 'wine';
  if (/^\d{3,4}[:\s]|^b\d{2,4}\b|^2\d{3}[:\s]/.test(n)) return 'wine';
  // Spirits
  if (/\b(vodka|belvedere|grey goose|ketel one|tito's|tito\b|hendrick|beefeater|bombay sapphire|botanist|fords gin|plymouth gin|tanqueray|absolut|monkey 47|asbury park gin|wodka)\b/.test(n)) return 'spirit';
  if (/\bcasamigos|don julio|fortaleza|lalo\b|pueblo viejo|casa dragones|del maguey|clase azul|g4 blanco|g4 reposado|g4 anejo|tanteo/.test(n)) return 'spirit';
  if (/\bangels envy|blanton|buffalo trace|bulleit|dewars|high west|jack daniel|jameson|johnnie walker|laguavulin|macallan|maker's mark|michter|oban 14|sazerac rye|whistlepig|widow jane|woodford reserve|basil hayden|four roses|penelope|glenlivet|old rip van winkle/.test(n)) return 'spirit';
  if (/chartreuse|\bcognac\b|pierre ferrand|grand marnier|fernet|lazzaroni|molinari sambuca|nonino amaro|averna amaro|limoncello|bailey|campari|taylor fladgate|\bport\b|braulio|frangelico|\brum\b|havana|havanna|captain morgan|ron zacapa|bacardi|st\. agrestis|varnelli/.test(n)) return 'spirit';
  if (/\bcodigo\b/.test(n)) return 'spirit';
  // Beer / coffee / NA
  if (/beer done|vliet|birdsmouth|kronenbourg|other half|grimm|athletic brewing/.test(n)) return 'beer';
  if (n === 'lunch') return 'beer';
  if (/\bespresso\b|\bcappuccino\b|\bmacchiato\b|\bcoffee\b|peppermint tea|chamomile tea|earl gr[ae]y|green tea|black tea/.test(n)) return 'coffee';
  if (/btl.*still water|btl.*sparkling water|\bcoke\b|diet coke|sprite|ginger ale|club soda|ginger beer|\btonic\b|shirley temple|lemonade|iced tea|apple juice|arnold palmer|pineapple juice|cranberry juice|fresh oj|milk/.test(n)) return 'na';
  // Entrées — dinner menu only (specials/lunch/sides/events already routed above)
  if (/wagyu|waygu|ratatouille|paillard|moules frites|lasagna|au poivre|pork chop|steak frites|roast chicken for|ny strip|new york strip|porterhouse|salmon\b|saumon|medaillons|branzino|red snapper|snapper|kids tenders|kids cheeseburger|chicken fingers/.test(n)) return 'food';
  // Raw bar (Les Fruits de Mer) — oysters auto-route via the ½-dozen catch,
  // so rotating varieties land here without a code change
  if (/1\s*\/\s*2\s*(dozen|dzn)|half\s*dozen|½\s*dozen/.test(n)) return 'rawbar';
  if (/crudo tasting|shrimp cocktail|tuna tartare|ceviche|fluke|caviar.*donut|dune fox|sloop point|salty rose|laughing gull|little darling|violet sky|swan point|sugar shack|barnegat/.test(n)) return 'rawbar';
  // Starters
  if (/bread service|little gem|garden salad|asparagus mimosa|escargots|^jambon|steak tartare|sardine toast|crepe aux|berries.*cream|salad de tomates|eggplant|peaches/.test(n)) return 'starter';
  // Desserts
  if (/carrot.*cake|meringue cake|chocolate cake|cheesecake|raspberry tart|creme brulee|banana split|brownie sundae|banana chip ice|brown butter ice|chocolate ice|strawberry ice|vanilla ice|mint ice|lemon sorbet|fromage/.test(n)) return 'dessert';
  if (/custom cake|fet d'or/.test(n)) return 'food';
  return 'food';
}

// Non-menu rows the chef can't act on — hidden from the view entirely.
// Includes Toast section-subtotal rows (e.g. Take Out's "Appetizers") that
// are blended rollups, not dishes — counting them double-counts revenue.
function isMiscRow(name) {
  const n = name.trim();
  if (/^open\s*(food|drink)|open item|^tip$|don'?t make/i.test(n)) return true;
  if (/^(appetizers?|entrees?|entrées?|sides|sandwiches|specials|desserts?|hors d'?oeuvres|petit d[ée]jeuner|beverages?)$/i.test(n)) return true;
  return false;
}

function isStaffOrComp(name) {
  return /[-–]\s*(staff|comp|void|comped|employee|mgr|manager)/i.test(name);
}

const sumRev = arr => (arr||[]).reduce((s,i)=>s+i.qty*i.price, 0);
const sumQty = arr => (arr||[]).reduce((s,i)=>s+i.qty, 0);
const fmt = n => n.toLocaleString('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 });

// ── Data ───────────────────────────────────────────────────────────────────
let currentData = null;
let currentView = 'quantity';

async function loadData() {
  const loading = document.getElementById('loading');
  const errBox = document.getElementById('error-box');
  loading.style.display = 'block';
  errBox.style.display = 'none';
  document.getElementById('dashboard').classList.remove('active');

  try {
    const resp = await fetch(`${WORKER_URL}/latest`, {
      headers: { 'Authorization': `Bearer ${getToken()}` }
    });
    if (resp.status === 401) {
      // Token expired or invalid — back to login
      logout();
      showLoginError('Session expired — log in again');
      return;
    }
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `Server error ${resp.status}`);
    }
    currentData = await resp.json();
    loading.style.display = 'none';
    renderDashboard();
  } catch (err) {
    loading.style.display = 'none';
    errBox.style.display = 'block';
    errBox.innerHTML = `<p>Couldn't load this week's data: ${err.message}</p>
      <p class="small">If this keeps happening, let Adam know.</p>
      <button class="retry-btn" onclick="loadData()">Try again</button>`;
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
function normalizeKey(name) {
  return name.toLowerCase().replace(/^hh:\s*/i, '').replace(/\s+/g, ' ').trim();
}
function deltaClass(v) { return v > 2 ? 'up' : v < -2 ? 'down' : 'flat'; }
function deltaArrow(v) { return v > 2 ? '\u25b2' : v < -2 ? '\u25bc' : '\u2014'; }
function deltaTag(cur, prev, cls) {
  if (prev === null || prev === undefined || prev === 0) return '';
  const d = (cur - prev) / prev * 100;
  return `<span class="${cls} ${deltaClass(d)}">${deltaArrow(d)} ${Math.abs(Math.round(d))}%</span>`;
}

// Blend a category color toward white -> SOLID hex (keeps text readable at any intensity)
function hexBlend(hex, w) {
  const c = hex.replace('#','');
  const mix = ch => Math.round(255*(1-w) + parseInt(ch,16)*w).toString(16).padStart(2,'0');
  return '#' + mix(c.substr(0,2)) + mix(c.substr(2,2)) + mix(c.substr(4,2));
}
function isLightBg(hex) {
  const c = hex.replace('#','');
  const lum = 0.299*parseInt(c.substr(0,2),16) + 0.587*parseInt(c.substr(2,2),16) + 0.114*parseInt(c.substr(4,2),16);
  return lum > 150;
}

function renderDashboard() {
  if (!currentData) return;
  const keep = i => !isStaffOrComp(i.name) && !isMiscRow(i.name);
  const items = (currentData.items || []).filter(keep);
  const prevItems = (currentData.prevItems || []).filter(keep);
  const hasPrev = prevItems.length > 0;

  let weekText = 'Week of ' + (currentData.dateRange || '\u2014');
  if (hasPrev && currentData.prevDateRange) weekText += '  \u00b7  vs ' + currentData.prevDateRange;
  document.getElementById('week-label').textContent = weekText;
  if (currentData.uploadedAt) {
    const d = new Date(currentData.uploadedAt);
    document.getElementById('uploaded-label').textContent =
      'Updated ' + d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) +
      ' ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  }

  const cats = {}, prevCats = {};
  items.forEach(i => { const c = categorize(i.name); (cats[c]||(cats[c]=[])).push(i); });
  prevItems.forEach(i => { const c = categorize(i.name); (prevCats[c]||(prevCats[c]=[])).push(i); });

  // Item-level lookup for last week (aggregated by normalized name)
  const prevLookup = {};
  prevItems.forEach(i => {
    const k = normalizeKey(i.name);
    if (!prevLookup[k]) prevLookup[k] = { qty: 0, rev: 0 };
    prevLookup[k].qty += i.qty;
    prevLookup[k].rev += i.qty * i.price;
  });

  const ranking = Object.keys(cats).map(key => ({
    key, label: CAT_LABELS[key], color: CAT_COLORS[key],
    qty: sumQty(cats[key]), rev: sumRev(cats[key]),
    prevQty: sumQty(prevCats[key]), prevRev: sumRev(prevCats[key]),
  })).filter(r => r.qty > 0);

  const byRev = currentView === 'revenue';
  const sorted = [...ranking].sort((a,b) => byRev ? b.rev - a.rev : b.qty - a.qty);

  const totalRev = ranking.reduce((s,r)=>s+r.rev, 0);
  const totalQty = ranking.reduce((s,r)=>s+r.qty, 0);
  const prevTotalRev = Object.keys(prevCats).reduce((s,k)=>s+sumRev(prevCats[k]), 0);
  const prevTotalQty = Object.keys(prevCats).reduce((s,k)=>s+sumQty(prevCats[k]), 0);
  const topCat = sorted[0];

  document.getElementById('kpi-grid').innerHTML = [
    { label:'Est. revenue', val:fmt(totalRev), sub:`${items.length} items`,
      delta: hasPrev ? deltaTag(totalRev, prevTotalRev, 'kpi-delta') : '' },
    { label:'Total sold', val:Math.round(totalQty).toLocaleString(), sub:`${ranking.length} categories`,
      delta: hasPrev ? deltaTag(totalQty, prevTotalQty, 'kpi-delta') : '' },
    { label:'Top category', val:topCat ? topCat.label.split(' ')[0] : '\u2014',
      sub:topCat ? (byRev ? fmt(topCat.rev) : `${Math.round(topCat.qty).toLocaleString()} sold`) : '', delta:'' },
  ].map(k => `<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-val">${k.val}</div><div class="kpi-sub">${k.sub}</div>${k.delta||''}</div>`).join('');

  // Category ranking, highest → lowest — bar = share of total (widths sum to 100%)
  document.getElementById('ranking-title').textContent =
    byRev ? 'Categories ranked by revenue' : 'Categories ranked by quantity';
  const totalMetric = byRev ? totalRev : totalQty;
  const headerHtml = `<div class="cat-header-row">
    <span class="cat-rank">#</span>
    <span class="cat-name">Category</span>
    <span class="cat-bar" style="background:transparent;height:auto;">Share of total</span>
    <span class="cat-share">%</span>
    <span class="cat-val">${byRev ? 'Revenue' : 'Qty sold'}</span>
    <span class="cat-sub">${byRev ? 'Qty sold' : 'Revenue'}</span>
    ${hasPrev ? '<span class="cat-delta" style="color:var(--text-3);">vs last wk</span>' : ''}
  </div>`;
  document.getElementById('ranking-list').innerHTML = headerHtml + sorted.map((r, idx) => {
    const val = byRev ? r.rev : r.qty;
    const prevVal = byRev ? r.prevRev : r.prevQty;
    const share = totalMetric > 0 ? val / totalMetric * 100 : 0;
    const width = Math.max(1.5, share);
    const main = byRev ? fmt(r.rev) : Math.round(r.qty).toLocaleString();
    const sub  = byRev ? `${Math.round(r.qty).toLocaleString()} sold` : fmt(r.rev);
    return `<div class="cat-row" onclick="jumpToCategory('${r.key}')" title="View ${r.label} items">
      <span class="cat-rank">${idx+1}</span>
      <span class="cat-name">${r.label}</span>
      <span class="cat-bar"><span class="cat-bar-fill" style="width:${width}%;background:${r.color};"></span></span>
      <span class="cat-share">${share < 1 ? share.toFixed(1) : Math.round(share)}%</span>
      <span class="cat-val">${main}</span>
      <span class="cat-sub">${sub}</span>
      ${hasPrev ? (deltaTag(val, prevVal, 'cat-delta') || '<span class="cat-delta flat">new</span>') : ''}
    </div>`;
  }).join('');

  // Per-category item breakdown with WoW per item
  let hmHtml = '';
  sorted.forEach(cat => {
    const grp = [...cats[cat.key]]
      .map(i => ({ ...i, rev: i.qty * i.price }))
      .sort((a,b) => byRev ? b.rev - a.rev : b.qty - a.qty);
    const maxR = byRev ? (grp[0]?.rev || 1) : (grp[0]?.qty || 1);
    const id = 'hmg-' + cat.key;
    hmHtml += `<div class="hm-cat-section">
      <div class="hm-cat-header" onclick="toggleHmGroup('${id}')">
        <span class="leg-dot" style="background:${cat.color}"></span>
        <span class="hm-cat-label">${cat.label}</span>
        <span class="hm-cat-rev">${fmt(cat.rev)} \u00b7 ${Math.round(cat.qty).toLocaleString()} sold \u00b7 ${grp.length} items</span>
        <span class="hm-cat-toggle" id="${id}-toggle">\u25bc</span>
      </div>
      <div class="hm-grid" id="${id}">`;
    grp.forEach(item => {
      const metric = byRev ? item.rev : item.qty;
      const weight = 0.25 + (metric / maxR) * 0.75;          // 0.25 (light) -> 1.0 (full color)
      const bg = hexBlend(cat.color, weight);
      const light = isLightBg(bg);
      const nameCol = light ? '#1a1a18' : '#ffffff';
      const metaCol = light ? 'rgba(26,26,24,0.65)' : 'rgba(255,255,255,0.8)';
      const upCol   = light ? '#1a7a3a' : '#a8ffbe';
      const dnCol   = light ? '#b83030' : '#ffb3b3';
      const flatCol = light ? 'rgba(26,26,24,0.5)' : 'rgba(255,255,255,0.65)';
      const name = item.name.replace(/^(GL:|HH:|\d{3,4}[:\s]|B\d{2,4}[:\s]?)\s*/i,'');
      const prev = hasPrev ? prevLookup[normalizeKey(item.name)] : null;
      let dHtml = '';
      if (hasPrev) {
        if (prev && prev.qty > 0) {
          const d = (item.qty - prev.qty) / prev.qty * 100;
          const dc = deltaClass(d);
          const dCol = dc === 'up' ? upCol : dc === 'down' ? dnCol : flatCol;
          dHtml = `<div class="hm-delta" style="color:${dCol};">${deltaArrow(d)} ${Math.abs(Math.round(d))}% wow</div>`;
        } else {
          dHtml = `<div class="hm-delta" style="color:${flatCol};">\u2605 new</div>`;
        }
      }
      hmHtml += `<div class="hm-cell" style="background:${bg};border-left-color:${cat.color};">
        <div class="hm-name" style="color:${nameCol};">${name}</div>
        <div class="hm-meta" style="color:${metaCol};">${Math.round(item.qty)} sold \u00b7 ${fmt(item.rev)}</div>
        ${dHtml}
      </div>`;
    });
    hmHtml += `</div></div>`;
  });
  document.getElementById('heatmap').innerHTML = hmHtml;

  document.getElementById('dashboard').classList.add('active');
}

function jumpToCategory(key) {
  const grid = document.getElementById('hmg-' + key);
  if (!grid) return;
  grid.classList.remove('collapsed');                       // drop it open if collapsed
  const tog = document.getElementById('hmg-' + key + '-toggle');
  if (tog) tog.textContent = '\u25bc';
  const section = grid.closest('.hm-cat-section');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  section.classList.remove('flash');
  void section.offsetWidth;                                 // restart the animation
  section.classList.add('flash');
}

function toggleHmGroup(id) {
  const el = document.getElementById(id);
  const tog = document.getElementById(id + '-toggle');
  tog.textContent = el.classList.toggle('collapsed') ? '▶' : '▼';
}

function setView(view) {
  currentView = view;
  document.getElementById('tg-revenue').classList.toggle('active', view === 'revenue');
  document.getElementById('tg-quantity').classList.toggle('active', view === 'quantity');
  if (currentData) renderDashboard();
}
</script>
</body>
</html>
