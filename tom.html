<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Desk Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f7f6f3; --panel:#fff; --fg:#1d1c1a; --muted:#6b6862; --line:#e4e1db; --accent:#2f6fdb; --bad:#c0392b;
    --sans:'Inter',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#161614; --panel:#1f1e1c; --fg:#ecebe8; --muted:#a29e96; --line:#33312d; --accent:#7aa6f5; --bad:#ef6b5b; } }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px}
  .lock{min-height:100%;display:grid;place-content:center;gap:4px;text-align:center;padding:24px 16px}
  .ico{font-size:30px;line-height:1}
  h1{font-family:var(--serif);font-weight:400;font-size:32px;margin:10px 0 2px}
  .sub{color:var(--muted);margin:0 0 18px;max-width:34ch}
  form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  input{font:inherit;padding:11px 13px;width:min(78vw,300px);border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--fg)}
  input:focus{outline:none;border-color:var(--accent)}
  button{font:inherit;font-weight:500;padding:11px 20px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .msg{min-height:1.2em;font-size:13px;margin:12px 0 0;color:var(--muted)}
  .msg.bad{color:var(--bad)}
  .foot{color:var(--muted);font-size:11.5px;letter-spacing:.03em;margin-top:28px;opacity:.8}
</style>
</head>
<body>
<main class="lock">
  <div class="ico">&#128274;</div>
  <h1>Deal Desk Daily</h1>
  <p class="sub">This dashboard is encrypted. Enter the password to open it.</p>
  <form id="f" autocomplete="on">
    <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password" autofocus>
    <button id="go" type="submit">Unlock</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="foot">AES-256-GCM &middot; Melius semper</p>
</main>

  const REMEMBER_IN_TAB = true;            // keep unlocked for this browser tab (survives the Microsoft sign-in round-trip)
  const SKEY = "ddd.k";                    // sessionStorage slot
  const $ = (id) => document.getElementById(id);
  const b2a = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function decrypt(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), { name: "PBKDF2" }, false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b2a(ENC.s), iterations: ENC.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"],
    );
    const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b2a(ENC.i) }, key, b2a(ENC.c));
    return new TextDecoder().decode(buf);
  }

  function render(html) { document.open(); document.write(html); document.close(); }

  async function attempt(pw, silent) {
    try {
      const html = await decrypt(pw);
      if (REMEMBER_IN_TAB) { try { sessionStorage.setItem(SKEY, pw); } catch (e) {} }
      render(html);
      return true;
    } catch (e) {
      if (silent) { try { sessionStorage.removeItem(SKEY); } catch (e2) {} }
      return false;
    }
  }

  const f = $("f"), pw = $("pw"), go = $("go"), msg = $("msg");

  if (!(window.crypto && crypto.subtle)) {
    go.disabled = true; pw.disabled = true;
    msg.className = "msg bad";
    msg.textContent = "This page must be served over https:// (or localhost) to decrypt. Opening the file directly from disk won't work.";
    return;
  }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; msg.className = "msg"; msg.textContent = "Decrypting\u2026";
    const ok = await attempt(pw.value, false);
    if (!ok) { go.disabled = false; msg.className = "msg bad"; msg.textContent = "Wrong password \u2014 try again."; pw.select(); }
  });

  // Auto-unlock if this tab already unlocked once (e.g. returning from the Microsoft sign-in redirect).
  if (REMEMBER_IN_TAB) {
    let saved = null; try { saved = sessionStorage.getItem(SKEY); } catch (e) {}
    if (saved) { msg.textContent = "Unlocking\u2026"; attempt(saved, true); }
  }
