<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPI Server Check</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231f4536'/><text x='50' y='68' font-family='serif' font-size='40' font-weight='bold' fill='%23d8b24a' text-anchor='middle'>RPI</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Mulish:ital,wght@0,400;0,700;0,800;1,400&display=swap">
<style>
/* Layout: single centered column; cover → one-question-at-a-time card → scoreplate. Admin is a gated table view. */
:root{
  --bg:#f3efe6;--surface:#fbf9f4;--ink:#1c2a24;--muted:#5e6b63;--line:#d9d2c3;
  --green:#1f4536;--green-soft:#2c5a46;--brass:#b08419;--brass-deep:#8a6612;
  --cream:#efe7d4;--good:#1f6d4b;--good-bg:#e4efe6;--bad:#9a2f2a;--bad-bg:#f4e3df;
  --shadow:0 1px 2px rgba(28,42,36,.06),0 8px 30px rgba(28,42,36,.09);
  --f-display:"Fraunces","Hoefler Text",Georgia,serif;--f-body:"Mulish","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13201a;--surface:#182a22;--ink:#ede8db;--muted:#9aa89f;--line:#2c4034;
  --green:#3f7d61;--green-soft:#4c9074;--brass:#d2a53f;--brass-deep:#b98c28;
  --cream:#1e3328;--good:#5bbf8e;--good-bg:#17382a;--bad:#e08a82;--bad-bg:#3a201e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.45);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13201a;--surface:#182a22;--ink:#ede8db;--muted:#9aa89f;--line:#2c4034;
  --green:#3f7d61;--green-soft:#4c9074;--brass:#d2a53f;--brass-deep:#b98c28;
  --cream:#1e3328;--good:#5bbf8e;--good-bg:#17382a;--bad:#e08a82;--bad-bg:#3a201e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.45);color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-block:26px 64px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:.7rem;font-weight:800;color:var(--brass-deep)}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.crest{background:var(--green);color:var(--cream);padding:30px 26px 26px;text-align:center;border-bottom:3px solid var(--brass)}
.crest .mark{font-family:var(--f-display);font-size:.76rem;letter-spacing:.4em;text-transform:uppercase;color:var(--brass);font-weight:600}
.crest h1{color:#fff;font-size:2rem;line-height:1.02;margin:.35rem 0 .15rem;font-style:italic}
.crest .sub{font-size:.88rem;color:#cdd8d0;letter-spacing:.04em}
.coverbody{padding:24px 26px 28px}
.coverbody p.lead{color:var(--muted);margin:.2rem 0 1.3rem;font-size:.96rem}
.field{display:block;margin-bottom:15px}
.field label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px}
.field input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
.motto{text-align:center;font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:.9rem;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;letter-spacing:.04em;padding:13px 22px;border-radius:3px;border:1px solid transparent;cursor:pointer;font-size:.92rem;transition:transform .05s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{background:var(--green-soft)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--brass);color:var(--brass-deep)}
.btn-brass{background:var(--brass);color:#2a2008;border-color:var(--brass)}
.btn-brass:hover{background:var(--brass-deep);color:#fff}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn.full{width:100%}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:3px;padding:10px 14px;font-size:.88rem;font-weight:700;margin-bottom:14px}
.err:empty{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.topbar .who{font-size:.82rem;color:var(--muted)}
.topbar .who b{color:var(--ink);font-family:var(--f-display);font-style:italic;font-weight:600}
.topbar .tools{display:flex;gap:8px;align-items:center}
.iconbtn{background:none;border:1px solid var(--line);border-radius:99px;height:34px;padding:0 12px;cursor:pointer;color:var(--muted);font:inherit;font-size:.8rem;font-weight:700;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--brass);color:var(--brass-deep)}
.progress{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.bar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;min-width:0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--brass));border-radius:99px;transition:width .3s ease}
.step{font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:24px 22px 22px}
.cat{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--brass-deep);margin-bottom:10px}
.qtext{font-family:var(--f-display);font-size:1.28rem;line-height:1.28;margin-bottom:18px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:3px;background:var(--bg);cursor:pointer;transition:border-color .12s,background .12s}
.choice:hover{border-color:var(--brass)}
.choice .tick{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--muted);margin-top:1px}
.choice .txt{min-width:0;font-size:.98rem}
.choice.sel{border-color:var(--green);background:var(--good-bg)}
.choice.sel .tick{background:var(--green);border-color:var(--green);color:#fff}
.choice.locked{cursor:default}
.choice.correct{border-color:var(--good);background:var(--good-bg)}
.choice.correct .tick{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .tick{background:var(--bad);border-color:var(--bad);color:#fff}
.blank{width:100%;padding:13px 15px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px}
.blank:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
.blank.locked{background:var(--surface)}
.blank.correct{border-color:var(--good);background:var(--good-bg)}
.blank.wrong{border-color:var(--bad);background:var(--bad-bg)}
.explain{margin-top:16px;padding:14px 16px;border-left:3px solid var(--brass);background:var(--cream);border-radius:0 3px 3px 0;font-size:.9rem}
.verdict{font-weight:800;letter-spacing:.04em;display:block;margin-bottom:3px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.scoreplate{text-align:center;padding:28px 24px 24px}
.scorenum{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-weight:600}
.scorenum.pass{color:var(--good)}.scorenum.fail{color:var(--bad)}
.scorestat{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-top:8px}
.stamp{display:inline-block;margin-top:14px;padding:7px 18px;border:2px solid;border-radius:3px;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;transform:rotate(-3deg)}
.stamp.pass{color:var(--good);border-color:var(--good)}.stamp.fail{color:var(--bad);border-color:var(--bad)}
.savemsg{font-size:.82rem;text-align:center;margin-top:12px;color:var(--muted)}
.savemsg.ok{color:var(--good)}.savemsg.no{color:var(--bad)}
.missed{margin-top:24px}
.missed h3{font-size:1.2rem;margin-bottom:4px}
.missed .sub{color:var(--muted);font-size:.86rem;margin-bottom:14px}
.mitem{border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 3px 3px 0;background:var(--surface);padding:14px 16px;margin-bottom:12px}
.mitem .mq{font-family:var(--f-display);font-size:1rem;margin-bottom:7px}
.mitem .ma{font-size:.88rem}
.mitem .ma .lab{font-weight:800;color:var(--good)}
.foot-motto{text-align:center;margin-top:36px;font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:.88rem}
/* admin */
.mgr table{width:100%;border-collapse:collapse;font-size:.9rem}
.mgr th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.mgr td{padding:10px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.mgr tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:800}
.pill.pass{background:var(--good-bg);color:var(--good)}
.pill.fail{background:var(--bad-bg);color:var(--bad)}
.statrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1;min-width:120px;background:var(--cream);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.stat .lab{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.stat .big{font-family:var(--f-display);font-size:1.9rem;font-weight:600;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.92rem}
.when{color:var(--muted);font-size:.78rem}
details.amgr{margin-top:6px}
details.amgr summary{cursor:pointer;color:var(--brass-deep);font-size:.82rem;font-weight:700}
details.amgr .qa{font-size:.84rem;margin:7px 0;padding-left:14px;border-left:2px solid var(--line)}
details.amgr .qa b{color:var(--good)}
details.amgr .qa.x b{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ---------- the 5 questions ---------- */
/* type:"mc" multiple choice (correct = index) | type:"fill" fill-in-the-blank (accept = array of OK answers, lowercased) */
const QUESTIONS=[
  {id:"q1",type:"mc",cat:"Service Philosophy",
   q:"Service is the foundation, but hospitality is the ___.",
   choices:["bare minimum","splash of color that makes it pop","icing on the cake","reason we're here"],
   correct:1,
   e:"Service is the foundation; hospitality is the splash of color that makes it pop."},
  {id:"q2",type:"fill",cat:"Service 101",
   q:"The 10/5 rule: at 10 feet you make eye contact and smile, and at 5 feet you ___ the guest.",
   accept:["greet"],
   display:"greet",
   e:"At 10 feet: eye contact and a smile. At 5 feet: greet them."},
  {id:"q3",type:"mc",cat:"Allergies",
   q:"A guest mentions an allergy. What is the FIRST step?",
   choices:["Ring it into Toast with a note","Tell a manager","Go to the kitchen and tell chef — before anything is entered in the POS","Ask the guest to pick a different dish"],
   correct:2,
   e:"Tell chef in the kitchen FIRST, before anything is inputted. Then name the ticket via TAB and mark the allergen on every item."},
  {id:"q4",type:"fill",cat:"Wine Service",
   q:"We have no house wines — every wine, by the glass or bottle, is a unique and special ___.",
   accept:["entity"],
   display:"entity",
   e:"We have no house wines. Every wine is a unique and special entity."},
  {id:"q5",type:"mc",cat:"Safe Alcohol Service",
   q:"You should check the ID of any guest who appears under:",
   choices:["21","25","30","40"],
   correct:2,
   e:"Check IDs of anyone who appears under 30. Accept licenses, passports, military or state IDs; consult a manager if unsure."}
];
const PASS=80; // percent

/* ---------- helpers ---------- */
const app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');}
function currentTheme(){const a=document.documentElement.getAttribute('data-theme');return a||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function toggleTheme(){const n=currentTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('rpi_theme',n);}catch(e){}render();}
try{const th=localStorage.getItem('rpi_theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}

/* ---------- db capability (present only inside the claude.ai artifact) ---------- */
let DB=null, USER=null, canAdmin=false;
async function initCaps(){
  if(typeof window.claude==='undefined'||!window.claude||!window.claude.use)return;
  try{DB=await claude.use('db');}catch(e){DB=null;}
  try{USER=await claude.use('user');}catch(e){USER=null;}
  try{canAdmin = USER ? (USER.isOwner()||USER.canEdit()) : false;}catch(e){canAdmin=false;}
}

/* ---------- state ---------- */
let state={phase:'cover',name:'',responses:{},idx:0,graded:false,coverErr:'',
  saved:false,saveError:'',admin:null};

/* ---------- grading ---------- */
function isCorrect(q){
  const r=state.responses[q.id];
  if(q.type==='mc') return r===q.correct;
  return q.accept.includes(norm(r));
}
function tally(){let c=0;QUESTIONS.forEach(q=>{if(isCorrect(q))c++;});return {correct:c,total:QUESTIONS.length,score:Math.round(c/QUESTIONS.length*100)};}

/* ---------- render ---------- */
function render(){({cover:renderCover,quiz:renderQuiz,result:renderResult,admin:renderAdmin}[state.phase]||renderCover)();}
function themeWord(){return currentTheme()==='dark'?'Light':'Dark';}
function topbar(){
  return `<div class="topbar">
    <div class="who">RPI Server Check${state.name?' &middot; <b>'+esc(state.name)+'</b>':''}</div>
    <div class="tools">
      ${canAdmin&&state.phase!=='admin'?'<button class="iconbtn" onclick="goAdmin()">Admin</button>':''}
      <button class="iconbtn" onclick="toggleTheme()">${themeWord()}</button>
    </div></div>`;
}

/* ----- cover ----- */
function renderCover(){
  app.innerHTML=(canAdmin?topbar():'')+`
  <div class="cover">
    <div class="crest"><div class="mark">River Pointe Inn &middot; Rumson, NJ</div><h1>Server Check</h1><div class="sub">Five standards. Takes about two minutes.</div></div>
    <div class="coverbody">
      <p class="lead">Put your name in and run through five quick questions from the floor standards. Your manager sees the results.</p>
      <div class="err" id="coverErr">${esc(state.coverErr)}</div>
      <div class="field"><label>Your name</label><input id="nm" type="text" autocomplete="name" value="${esc(state.name)}" placeholder="First and last"></div>
      <button class="btn btn-primary full" onclick="beginQuiz()">Start the check</button>
      <div class="motto">&ldquo;Melius semper&rdquo; &mdash; always better</div>
    </div>
  </div>`;
  const nm=document.getElementById('nm');
  if(nm)nm.addEventListener('keydown',e=>{if(e.key==='Enter')beginQuiz();});
}
function beginQuiz(){
  const nm=document.getElementById('nm');const v=nm?nm.value.trim():'';
  if(!v){state.coverErr='Enter your name to start.';const e=document.getElementById('coverErr');if(e)e.textContent=state.coverErr;return;}
  state.name=v;state.coverErr='';state.idx=0;state.graded=false;state.responses={};state.phase='quiz';render();window.scrollTo(0,0);
}

/* ----- quiz ----- */
function renderQuiz(){
  const q=QUESTIONS[state.idx],i=state.idx,graded=state.graded,r=state.responses[q.id];
  const pct=Math.round(i/QUESTIONS.length*100);
  let answerHtml='';
  if(q.type==='mc'){
    answerHtml=`<div class="choices">${q.choices.map((c,ci)=>{
      let cls='choice';
      if(graded){cls+=' locked';if(ci===q.correct)cls+=' correct';else if(ci===r)cls+=' wrong';}
      else if(ci===r)cls+=' sel';
      const letter=String.fromCharCode(65+ci);
      const mark=graded?(ci===q.correct?'✓':(ci===r?'✗':letter)):letter;
      return `<label class="${cls}" ${graded?'':'onclick="pickMc('+ci+')"'}><span class="tick">${mark}</span><span class="txt">${esc(c)}</span></label>`;
    }).join('')}</div>`;
  }else{
    let cls='blank';
    if(graded)cls+=' locked '+(isCorrect(q)?'correct':'wrong');
    answerHtml=`<input class="${cls}" id="blank" type="text" autocomplete="off" placeholder="Type your answer" value="${esc(r||'')}" ${graded?'disabled':'oninput="typeBlank(this.value)"'}>`;
  }
  const verdictOk=isCorrect(q);
  app.innerHTML=topbar()+`
  <div class="progress"><div class="step">Q ${i+1} / ${QUESTIONS.length}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="step">${Object.keys(state.responses).length} answered</div></div>
  <div class="card">
    <div class="cat">${esc(q.cat)}${q.type==='fill'?' &middot; fill in the blank':''}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${answerHtml}
    ${graded?`<div class="explain"><span class="verdict ${verdictOk?'ok':'no'}">${verdictOk?'✓ Correct':'✗ Not quite'}</span>${q.type==='fill'?'Answer: <b>'+esc(q.display)+'</b>. ':''}${esc(q.e)}</div>`:''}
    <div class="qnav">
      <button class="btn btn-ghost" ${i===0?'disabled style="opacity:.4;cursor:not-allowed"':'onclick="prevQ()"'}>&larr; Back</button>
      ${graded?`<button class="btn btn-primary" onclick="nextQ()">${i===QUESTIONS.length-1?'See results':'Next &rarr;'}</button>`:`<button class="btn btn-brass" onclick="lockIn()">Lock in answer</button>`}
    </div>
  </div>`;
  if(!graded&&q.type==='fill'){const b=document.getElementById('blank');if(b){b.focus();b.addEventListener('keydown',e=>{if(e.key==='Enter')lockIn();});}}
}
function pickMc(ci){state.responses[QUESTIONS[state.idx].id]=ci;render();}
function typeBlank(v){state.responses[QUESTIONS[state.idx].id]=v;}
function lockIn(){
  const q=QUESTIONS[state.idx];
  if(q.type==='fill'){const b=document.getElementById('blank');if(b)state.responses[q.id]=b.value;}
  const r=state.responses[q.id];
  if(r===undefined||r===null||(q.type==='fill'&&!String(r).trim())){flashNeedAnswer();return;}
  state.graded=true;render();
}
function flashNeedAnswer(){
  const nav=document.querySelector('.qnav');
  if(!nav)return;
  let m=document.getElementById('needans');
  if(!m){m=document.createElement('div');m.id='needans';m.className='err';m.style.marginTop='14px';m.textContent='Pick or type an answer first.';nav.parentNode.insertBefore(m,nav);}
}
function prevQ(){state.idx--;state.graded=false;render();window.scrollTo(0,0);}
function nextQ(){
  if(state.idx===QUESTIONS.length-1){finish();}
  else{state.idx++;state.graded=false;render();window.scrollTo(0,0);}
}

/* ----- submit ----- */
async function finish(){
  state.phase='result';state.saved=false;state.saveError='';render();window.scrollTo(0,0);
  const {correct,total,score}=tally();
  const detail=QUESTIONS.map(q=>({id:q.id,ok:isCorrect(q),answer:q.type==='mc'?(state.responses[q.id]!=null?q.choices[state.responses[q.id]]:''):String(state.responses[q.id]||'')}));
  if(!DB){state.saveError='no-db';render();return;}
  try{
    const docId=Date.now()+'-'+Math.random().toString(36).slice(2,8);
    await DB.collection('submissions').doc(docId).set({
      name:state.name, score, correct, total, passed:score>=PASS,
      detail, at:new Date().toISOString()
    });
    state.saved=true;
  }catch(e){state.saved=false;state.saveError=(e&&e.code)||'error';}
  render();
}

/* ----- result ----- */
function renderResult(){
  const {correct,total,score}=tally();const passed=score>=PASS;
  const missed=QUESTIONS.filter(q=>!isCorrect(q));
  let saveLine;
  if(state.saveError==='no-db') saveLine='<div class="savemsg no">Not saved — the shared results store isn’t available in this view. Your score shows below.</div>';
  else if(state.saveError) saveLine='<div class="savemsg no">Couldn’t save to the manager rollup ('+esc(state.saveError)+'). Your score still shows below.</div>';
  else if(state.saved) saveLine='<div class="savemsg ok">Sent to your manager’s rollup.</div>';
  else saveLine='<div class="savemsg">Saving…</div>';
  app.innerHTML=topbar()+`
  <div class="cover"><div class="scoreplate">
    <div class="eyebrow">${esc(state.name)}</div>
    <div class="scorenum ${passed?'pass':'fail'}">${score}%</div>
    <div class="scorestat">${correct} of ${total} correct</div>
    <div class="stamp ${passed?'pass':'fail'}">${passed?'Passed':'Review needed'}</div>
  </div></div>
  ${saveLine}
  <div class="btn-row" style="margin-top:16px;justify-content:center">
    <button class="btn btn-ghost" onclick="retake()">Take again</button>
    ${canAdmin?'<button class="btn btn-brass" onclick="goAdmin()">Admin rollup</button>':''}
  </div>
  ${missed.length?`<div class="missed"><h3>Worth another look</h3><div class="sub">${missed.length} to review before service.</div>
    ${missed.map(q=>`<div class="mitem"><div class="mq">${esc(q.q)}</div><div class="ma"><span class="lab">Standard:</span> ${esc(q.type==='mc'?q.choices[q.correct]:q.display)}. <span style="color:var(--muted)">${esc(q.e)}</span></div></div>`).join('')}</div>`
    :`<div class="missed"><h3>Clean sweep</h3><div class="sub">All five correct. That’s the standard.</div></div>`}
  <div class="foot-motto">Treat each table as your first of the day.</div>`;
}
function retake(){state.phase='cover';state.responses={};state.idx=0;state.graded=false;render();window.scrollTo(0,0);}

/* ----- admin ----- */
let adminUnsub=null;
async function goAdmin(){
  if(!canAdmin)return;
  state.phase='admin';state.admin=null;render();window.scrollTo(0,0);
  if(!DB){state.admin={error:'The shared results store isn’t available in this view.'};render();return;}
  if(adminUnsub){try{adminUnsub();}catch(e){}adminUnsub=null;}
  let settled=false;
  const timer=setTimeout(()=>{if(!settled&&!state.admin){state.admin={loadingSlow:true};render();}},10000);
  try{
    adminUnsub=DB.collection('submissions').onSnapshot(
      snap=>{settled=true;clearTimeout(timer);
        const rows=snap.docs.map(d=>Object.assign({_id:d.id},d.data())).filter(r=>r&&r.name);
        rows.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
        state.admin={rows};if(state.phase==='admin')render();},
      err=>{settled=true;clearTimeout(timer);state.admin={error:(err&&err.message)||'Couldn’t load results.'};if(state.phase==='admin')render();}
    );
  }catch(e){clearTimeout(timer);state.admin={error:(e&&e.message)||'Couldn’t load results.'};render();}
}
function leaveAdmin(){if(adminUnsub){try{adminUnsub();}catch(e){}adminUnsub=null;}state.phase='cover';render();window.scrollTo(0,0);}
function renderAdmin(){
  const a=state.admin;let body;
  if(!a||(!a.rows&&!a.error&&!a.loadingSlow))body='<div class="empty">Loading results…</div>';
  else if(a.error)body='<div class="err">'+esc(a.error)+'</div>';
  else{
    const rows=a.rows||[];
    if(!rows.length){
      body=(a.loadingSlow?'<div class="savemsg no" style="text-align:left">Taking a while to reach the results store—this may be out of date.</div>':'')
        +'<div class="empty">No results in yet. Share the link with your servers and their scores will land here.</div>';
    }else{
      const n=rows.length, passed=rows.filter(r=>r.passed).length;
      const avg=Math.round(rows.reduce((s,r)=>s+(r.score||0),0)/n);
      body=`<div class="statrow">
        <div class="stat"><div class="lab">Submissions</div><div class="big">${n}</div></div>
        <div class="stat"><div class="lab">Passed</div><div class="big">${passed}/${n}</div></div>
        <div class="stat"><div class="lab">Avg score</div><div class="big">${avg}%</div></div>
      </div>
      <div class="mgr" style="overflow-x:auto"><table><thead><tr><th>Server</th><th>Score</th><th>Result</th><th>When</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.name)}${adminDetail(r)}</td><td>${r.score!=null?r.score+'%':'—'}</td><td>${r.passed?'<span class="pill pass">Pass</span>':'<span class="pill fail">Review</span>'}</td><td class="when">${fmtWhen(r.at)}</td></tr>`).join('')}
      </tbody></table></div>`;
    }
  }
  app.innerHTML=topbar()+`<div class="cover"><div class="crest"><div class="mark">River Pointe Inn</div><h1>Server Check &mdash; Rollup</h1><div class="sub">Every submission, live</div></div><div class="coverbody">${body}
    <div class="btn-row" style="margin-top:18px"><button class="btn btn-ghost" onclick="leaveAdmin()">&larr; Back</button></div>
  </div></div>`;
}
function adminDetail(r){
  if(!r.detail||!r.detail.length)return '';
  return `<details class="amgr"><summary>answers</summary>${r.detail.map(d=>{
    const q=QUESTIONS.find(x=>x.id===d.id);const label=q?q.cat:d.id;
    return `<div class="qa ${d.ok?'':'x'}">${esc(label)}: <b>${d.ok?'✓':'✗'}</b> ${esc(d.answer||'(blank)')}</div>`;
  }).join('')}</details>`;
}
function fmtWhen(iso){
  if(!iso)return '—';
  const d=new Date(iso);if(isNaN(d))return '—';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

/* ---------- boot ---------- */
(async function(){
  render(); // paint cover immediately
  await initCaps();
  render(); // re-paint so admin button appears for managers
})();
</script>
</body>
</html>
